# Netlify Configuration for Data Science Digital Lab Manual
# Mohan Babu University - School of Computing

[build]
  # Build command
  command = "npm run build"
  
  # Output directory
  publish = "dist"
  
  # Build environment variables
  [build.environment]
    NODE_VERSION = "20"

# SPA redirect rule - serve index.html for all routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Custom headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Optional: Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
